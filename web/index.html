<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kadr</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand" title="kadr"><svg viewBox="0 0 32 32" class="logo"><path d="M7 7v18M25 7v18M7 7h5M7 25h5M25 7h-5M25 25h-5" stroke="#e8ff59" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M13.5 11.5v9l7-4.5z" fill="#e8ff59"/></svg><span class="word">kadr</span></div>
  <nav class="menubar" id="menubar" aria-label="Menu"></nav>
  <button class="proj-btn" id="projBtn" title="Projects: recent, open, new  Ctrl+O"><span class="proj" id="projName">—</span><svg viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></button>
  <div class="status" id="status"><span class="dot"></span><span class="st-text"></span></div>
  <div class="grow"></div>
  <div class="pills" id="pills"></div>
  <button class="btn ghost icon" id="undoBtn" title="Undo  Ctrl+Z"><svg viewBox="0 0 16 16"><path d="M6 4 3 7l3 3M3.5 7H10a3 3 0 0 1 0 6H8"/></svg></button>
  <button class="btn ghost icon" id="redoBtn" title="Redo  Ctrl+Shift+Z"><svg viewBox="0 0 16 16"><path d="m10 4 3 3-3 3m2.5-3H6a3 3 0 0 0 0 6h2"/></svg></button>
  <button class="btn ghost ws-btn" id="wsBtn" title="Workspace: how the panels are laid out"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2 6.5h12M6.5 6.5v7"/></svg><span>Editing</span><svg class="chev" viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></button>
  <button class="btn ghost" id="templatesBtn" title="Templates gallery"><svg viewBox="0 0 16 16"><path d="M8 1.8 9.3 6.7 14.2 8 9.3 9.3 8 14.2 6.7 9.3 1.8 8 6.7 6.7z"/></svg><span>Templates</span></button>
  <button class="btn primary" id="exportBtn"><span>Export</span></button>
</header>

<main class="work" id="work">
  <aside class="panel bin" id="bin"></aside>
  <section class="viewer">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage"></div>
      <div class="stage-overlay" id="stageOverlay"></div>
      <div class="stage-empty" id="stageEmpty">
        <div class="start">
          <div class="start-art" id="startArt"></div>
          <b>Let's make a video</b>
          <span>Bring your footage, start from a template, or just describe it.</span>
          <div class="start-actions">
            <button class="start-card" id="startImport"><i class="si si-media"></i><b>Import media</b><small>Video, audio, images. Or drop them anywhere.</small></button>
            <button class="start-card" id="startTemplates"><i class="si si-tpl"></i><b>Templates</b><small>Titles, captions, charts, logo reveals…</small></button>
            <button class="start-card" id="startChat"><i class="si si-chat"></i><b>Describe it</b><small>Your product, song, photos or website: the AI builds the video.</small></button>
          </div>
        </div>
      </div>
    </div>
    <div class="transport">
      <div class="tc" id="tcNow">00:00:00:00</div>
      <div class="grow"></div>
      <button class="btn ghost icon" id="tStart" title="Start  Home"><svg viewBox="0 0 16 16"><path d="M4 3v10M12 3 6 8l6 5z"/></svg></button>
      <button class="btn ghost icon" id="tPrev" title="Previous frame  ←"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="btn icon play" id="tPlay" title="Play / pause  Space"><svg class="i-play" viewBox="0 0 16 16"><path d="M5.5 3.5v9l7-4.5z"/></svg><svg class="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg></button>
      <button class="btn ghost icon" id="tNext" title="Next frame  →"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      <button class="btn ghost icon" id="tEnd" title="End  End"><svg viewBox="0 0 16 16"><path d="M12 3v10M4 3l6 5-6 5z"/></svg></button>
      <div class="grow"></div>
      <button class="btn ghost icon toggle" id="tLoop" title="Loop in/out  Shift+L"><svg viewBox="0 0 16 16"><path d="M3 7V6a2 2 0 0 1 2-2h7l-2-2M13 9v1a2 2 0 0 1-2 2H4l2 2"/></svg></button>
      <button class="btn ghost icon toggle" id="tGuides" title="Safe areas and thirds  G"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><rect x="4.5" y="5.2" width="7" height="5.6" rx=".5" stroke-dasharray="1.6 1.4"/></svg></button>
      <button class="btn ghost icon" id="tSnapshot" title="Save this frame as PNG"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" rx="2"/><circle cx="8" cy="8.5" r="2.2"/></svg></button>
      <div class="tc dim" id="tcDur">00:00:00:00</div>
    </div>
  </section>
  <aside class="panel side" id="side">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="props">Properties</button>
      <button class="tab" data-tab="chat">Chat <span class="tab-dot" id="chatDot"></span></button>
      <span class="tab-ink" id="tabInk"></span>
    </div>
    <div class="pane on" id="inspector" data-pane="props"></div>
    <div class="pane" id="chat" data-pane="chat"></div>
  </aside>
</main>

<div class="splitter" id="splitter"></div>

<section class="timeline" id="timeline">
  <div class="tl-bar">
    <div class="seg">
      <button class="btn ghost icon toggle on" id="toolSelect" title="Select  V"><svg viewBox="0 0 16 16"><path d="M4 2.5v10l3-2.5 2 4 1.6-.8-2-3.9H12z"/></svg></button>
      <button class="btn ghost icon toggle" id="toolRazor" title="Razor  C"><svg viewBox="0 0 16 16"><circle cx="4.5" cy="11.5" r="2"/><circle cx="11.5" cy="11.5" r="2"/><path d="M5.8 10 12 2.5M10.2 10 4 2.5"/></svg></button>
    </div>
    <button class="btn ghost icon toggle on" id="snapBtn" title="Snapping  N"><svg viewBox="0 0 16 16"><path d="M4 2v6a4 4 0 0 0 8 0V2M4 5h3M9 5h3"/></svg></button>
    <span class="sep"></span>
    <button class="btn ghost icon" id="splitBtn" title="Split at playhead  S"><svg viewBox="0 0 16 16"><path d="M8 2v12M3 5h3v6H3M13 5h-3v6h3"/></svg></button>
    <button class="btn ghost icon" id="addTextBtn" title="Text clip  T"><svg viewBox="0 0 16 16"><path d="M3 4V3h10v1M8 3v10M6 13h4"/></svg></button>
    <button class="btn ghost icon" id="addMarkerBtn" title="Marker  M"><svg viewBox="0 0 16 16"><path d="M4 2.5h8v6l-4 5-4-5z"/></svg></button>
    <span class="sep"></span>
    <button class="btn ghost icon" id="addVTrack" title="Add video track"><svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="2"/><path d="M8 6v4M6 8h4"/></svg></button>
    <button class="btn ghost icon" id="addATrack" title="Add audio track"><svg viewBox="0 0 16 16"><path d="M2 8h1M4.5 6v4M7 4.5v7M9.5 6.5v3"/><path d="M12.5 5.5v5M10 8h5"/></svg></button>
    <div class="grow"></div>
    <span class="range-info" id="rangeInfo"></span>
    <button class="btn ghost icon" id="helpBtn" title="Keyboard shortcuts">?</button>
    <button class="btn ghost icon" id="zoomFit" title="Zoom to fit  \"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
    <input type="range" id="zoom" min="0" max="1000" value="500" title="Zoom  − / +">
  </div>
  <div class="tl-scroll" id="tlScroll">
    <div class="tl-inner" id="tlInner">
      <div class="tl-ruler-row"><div class="tl-corner" id="tlCorner"></div><canvas id="tlRuler"></canvas></div>
      <div id="tlRows"></div>
      <div id="tlParts" class="tl-parts" hidden></div>
      <div id="tlMarks"></div>
      <div class="tl-range" id="tlRange"></div>
      <div class="tl-snap" id="tlSnap"></div>
      <div class="tl-playhead" id="tlPlayhead"></div>
    </div>
  </div>
</section>

<div class="pop" id="pop" hidden></div>
<div class="modal-back" id="modal" hidden></div>
<div class="toast" id="toast"></div>
<div class="drop-veil" id="dropVeil" hidden><div>Drop to import into media/</div></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
