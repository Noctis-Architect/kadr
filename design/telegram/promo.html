<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Fa; src: local("Noto Sans Arabic"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #09090a; }
  body { position: relative; font-family: "Noto Sans Arabic", "Inter", system-ui, sans-serif; color: #ececef; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 75%); }
  .glow { position: absolute; left: 50%; top: 420px; width: 1000px; height: 460px; transform: translateX(-50%); background: radial-gradient(closest-side, #e8ff5933, transparent); filter: blur(30px); }
  .head { position: absolute; top: 46px; left: 0; right: 0; text-align: center; }
  .pill { display: inline-flex; gap: 10px; align-items: center; height: 32px; padding: 0 16px; border-radius: 16px; background: #e8ff5914; border: 1px solid #e8ff5940; color: #e8ff59; font-size: 15px; font-weight: 600; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: #e8ff59; }
  .title { margin-top: 14px; display: flex; justify-content: center; align-items: center; gap: 18px; direction: ltr; }
  .title svg { width: 64px; height: 64px; }
  .title .en { font-family: Inter, system-ui, sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -0.04em; }
  .title .sep { width: 2px; height: 46px; background: #2a2a30; }
  .title .fa { font-weight: 800; font-size: 56px; }
  .tag { margin-top: 6px; font-size: 25px; color: #a1a1aa; font-weight: 500; }
  .tag b { color: #ececef; font-weight: 700; }
  .os { margin-top: 18px; display: flex; justify-content: center; gap: 10px; direction: ltr; }
  .os span { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 10px; background: #141417; border: 1px solid #222227; font: 600 16px Inter, system-ui, sans-serif; color: #d4d4d8; }
  .os svg { width: 17px; height: 17px; fill: #d4d4d8; }
  .shot { position: absolute; left: 50%; top: 345px; width: 1060px; transform: translateX(-50%); border-radius: 14px; overflow: hidden; border: 1px solid #2a2a30; box-shadow: 0 30px 80px #000c, 0 0 0 6px #ffffff06; }
  .shot img { display: block; width: 100%; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(transparent, #09090a); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="head">
    <div class="pill"><i></i>نسخه‌ی دسکتاپ · رایگان و متن‌باز</div>
    <div class="title">
      <svg viewBox="0 0 32 32"><path d="M7 7v18M25 7v18M7 7h5M7 25h5M25 7h-5M25 25h-5" stroke="#e8ff59" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M13.5 11.5v9l7-4.5z" fill="#e8ff59"/></svg>
      <span class="en">kadr</span><span class="sep"></span><span class="fa">کادر</span>
    </div>
    <div class="tag">ادیتور ویدیو که <b>با حرف زدن</b> ادیت می‌کنه، روی کامپیوتر خودت</div>
    <div class="os">
      <span><svg viewBox="0 0 24 24"><path d="M3 5.5 10 4.5v7H3zM11 4.3 21 3v8.5H11zM3 12.5h7v7L3 18.5zM11 12.5h10V21l-10-1.4z"/></svg>Windows</span>
      <span><svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.1.1 2.3-.6 3-1.5z"/></svg>macOS</span>
      <span><svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="6.5" ry="8"/><ellipse cx="12" cy="15.5" rx="4" ry="5.6" fill="#141417"/><circle cx="12" cy="6.5" r="4.3"/><circle cx="10.4" cy="6" r=".9" fill="#141417"/><circle cx="13.6" cy="6" r=".9" fill="#141417"/><path d="M10.6 8.2h2.8L12 9.6z" fill="#e8ff59"/><ellipse cx="8.4" cy="21.6" rx="2.6" ry="1.2" fill="#e8ff59"/><ellipse cx="15.6" cy="21.6" rx="2.6" ry="1.2" fill="#e8ff59"/></svg>Linux</span>
    </div>
  </div>
  <div class="shot"><img src="app.png"></div>
  <div class="fade"></div>
</body>
</html>
