<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:category" content="Titles">
<meta name="kadr:duration" content="4">
<meta name="kadr:description" content="Title card: accent rule, big title and subtitle rising out of a mask.">
<meta name="kadr:props" content='{"title":"Made with kadr","subtitle":"HTML, CSS and a timeline","accent":"#e8ff59"}'>
<title>Title card</title>
<!--
  Pure-CSS composition: every animation is timed from composition start
  with animation-delay. kadr pauses them and seeks them, so no JS is needed.
  Props: title, subtitle, accent
-->
<style>
  :root { --accent: #e8ff59; --ink: #f4f4f0; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: system-ui, sans-serif; color: var(--ink); }

  .card { position: absolute; left: 8%; bottom: 17%; animation: leave .5s cubic-bezier(.7, 0, .84, 0) 3.4s both; }
  .rule { height: 6px; width: 140px; background: var(--accent); transform-origin: left; animation: grow .7s cubic-bezier(.2, .8, .2, 1) .1s both; }
  .mask { overflow: hidden; padding-bottom: .08em; }
  .title { margin: 28px 0 0; font-size: 132px; font-weight: 800; letter-spacing: -.035em; line-height: 1; animation: up .9s cubic-bezier(.16, 1, .3, 1) .25s both; }
  .sub { margin-top: 14px; font-size: 40px; font-weight: 500; opacity: .72; animation: up .9s cubic-bezier(.16, 1, .3, 1) .45s both; }

  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes up { from { transform: translateY(110%); } to { transform: translateY(0); } }
  @keyframes leave { to { opacity: 0; transform: translateY(-24px); } }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="mask"><h1 class="title" data-prop="title">Made with kadr</h1></div>
    <div class="mask"><div class="sub" data-prop="subtitle">HTML, CSS and a timeline</div></div>
  </div>
</body>
</html>
