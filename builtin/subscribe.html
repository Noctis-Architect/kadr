<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:duration" content="4.5">
<meta name="kadr:category" content="Social">
<meta name="kadr:description" content="Subscribe button: pops in, a cursor clicks it, it turns into Subscribed and the bell rings.">
<meta name="kadr:props" content='{"label":"Subscribe","done":"Subscribed","channel":"@yourchannel","accent":"#ff3b30"}'>
<title>Subscribe</title>
<style>
  :root { --accent: #ff3b30; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: system-ui, "Vazirmatn", sans-serif; }
  .wrap { position: absolute; left: 50%; bottom: 14%; zoom: 1.5; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; padding: 18px 22px 18px 18px; border-radius: 26px; background: rgba(16, 16, 20, .9); box-shadow: 0 20px 60px rgba(0, 0, 0, .45); animation: popin .7s cubic-bezier(.34, 1.56, .64, 1) .1s both, popout .5s cubic-bezier(.7, 0, .84, 0) 4s both; }
  .avatar { width: 78px; height: 78px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #ffb199); }
  .channel { color: #fff; font-size: 34px; font-weight: 700; min-width: 210px; }
  .btn { position: relative; height: 70px; padding: 0 36px; border-radius: 35px; display: grid; place-items: center; font-size: 30px; font-weight: 800; letter-spacing: .02em; overflow: hidden; }
  .btn .a, .btn .b { grid-area: 1 / 1; }
  .btn .a { color: #fff; }
  .btn .b { color: #dcdce0; opacity: 0; animation: show .01s linear 2.05s both; }
  .btn::before { content: ""; position: absolute; inset: 0; background: var(--accent); animation: gray .25s ease-out 2s both; }
  .btn > span { position: relative; }
  .btn .a { animation: hide .01s linear 2.05s both; }
  .press { animation: press .3s ease-out 1.9s both; }
  .bell { width: 56px; height: 56px; border-radius: 50%; background: #26262c; display: grid; place-items: center; transform-origin: 50% 10%; animation: ring .9s ease-in-out 2.4s both; }
  .bell svg { width: 30px; height: 30px; }
  .cursor { position: absolute; width: 54px; height: 54px; left: 62%; top: 120%; animation: move 1.2s cubic-bezier(.16, 1, .3, 1) .8s both, tap .3s ease-out 1.9s both, away .8s cubic-bezier(.7, 0, .84, 0) 2.6s both; }
  @keyframes popin { from { opacity: 0; transform: translate(-50%, 40px) scale(.8); } }
  @keyframes popout { to { opacity: 0; transform: translate(-50%, 30px) scale(.9); } }
  @keyframes move { from { left: 110%; top: 160%; opacity: 0; } to { left: 62%; top: 52%; opacity: 1; } }
  @keyframes tap { 50% { transform: scale(.82); } }
  @keyframes away { to { left: 120%; top: 140%; opacity: 0; } }
  @keyframes press { 50% { transform: scale(.94); } }
  @keyframes gray { to { background: #33333a; } }
  @keyframes hide { to { opacity: 0; } }
  @keyframes show { to { opacity: 1; } }
  @keyframes ring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(18deg); } 30% { transform: rotate(-16deg); } 45% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 75% { transform: rotate(4deg); } }
</style>
</head>
<body>
  <div class="wrap" data-part="Card">
    <div class="avatar"></div>
    <div class="channel" data-part="Channel" data-prop="channel" dir="auto">@yourchannel</div>
    <div class="press" data-part="Button press"><div class="btn" data-part="Button"><span class="a" data-prop="label" dir="auto">Subscribe</span><span class="b" data-prop="done" dir="auto">Subscribed</span></div></div>
    <div class="bell" data-part="Bell"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5.5-6.84V3a1.5 1.5 0 0 0-3 0v1.16A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg></div>
    <svg class="cursor" data-part="Cursor" viewBox="0 0 24 24"><path d="M5 2.5l13.5 11-6 .6 3.6 6.9-2.6 1.4-3.6-7L5 19.5z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</body>
</html>
