<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:category" content="Transitions">
<meta name="kadr:duration" content="1">
<meta name="kadr:description" content="Transition: stripes slide in one after another until the frame is covered at the cut, then slide away. Put it on the top track centered on a cut.">
<meta name="kadr:props" content='{"color":"#e8ff59","color2":"#1d1d22","count":6,"direction":"up"}'>
<meta name="kadr:fields" content='{"count":{"type":"number","min":2,"max":16,"step":1,"label":"Stripes"},"direction":{"options":["up","down","left","right"]}}'>
<title>Stripes</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .s { position: absolute; will-change: transform; }
</style>
</head>
<body>
<script>
  const n = Math.max(2, Math.min(16, Math.round(Number(kadr.prop('count', 6)))));
  const dir = kadr.prop('direction', 'up');
  const vertical = dir === 'up' || dir === 'down';
  const sign = dir === 'up' || dir === 'left' ? 1 : -1;
  const els = [];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 's';
    s.style.background = i % 2 ? kadr.prop('color2', '#1d1d22') : kadr.prop('color', '#e8ff59');
    // stripes overlap by a pixel so no gaps show
    if (vertical) { s.style.top = '0'; s.style.bottom = '0'; s.style.left = `calc(${(i * 100) / n}% - 1px)`; s.style.width = `calc(${100 / n}% + 2px)`; } else { s.style.left = '0'; s.style.right = '0'; s.style.top = `calc(${(i * 100) / n}% - 1px)`; s.style.height = `calc(${100 / n}% + 2px)`; }
    document.body.append(s);
    els.push(s);
  }
  kadr.onFrame(() => {
    const p = kadr.progress;
    const stagger = 0.35; // part of each half the stripes are spread over
    els.forEach((s, i) => {
      const d = (i / (n - 1)) * stagger;
      let off;
      if (p < 0.5) off = 1 - kadr.ease.outCubic(Math.min(1, Math.max(0, (p / 0.5 - d) / (1 - stagger)))); // coming in: 1 → 0
      else off = -kadr.ease.inCubic(Math.min(1, Math.max(0, ((p - 0.5) / 0.5 - d) / (1 - stagger)))); // leaving: 0 → -1
      const v = (sign * off * 100).toFixed(3);
      s.style.transform = vertical ? `translateY(${v}%)` : `translateX(${v}%)`;
    });
  });
</script>
</body>
</html>
