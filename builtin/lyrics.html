<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:category" content="Text">
<meta name="kadr:duration" content="8">
<meta name="kadr:description" content="Lyrics or any timed text, line by line, synced to the music. props.lines = [{t, s, e}] in seconds from the clip start (optional words: [{w, s, e}] for exact word timing). Wrap a word in *stars* for the accent color. Styles: pop, fade, type, karaoke, kinetic, stack.">
<meta name="kadr:props" content='{"style":"pop","position":"bottom","size":76,"color":"#ffffff","accent":"#e8ff59","font":"system-ui, Vazirmatn, sans-serif","weight":"800","shadow":true,"upper":false}'>
<meta name="kadr:fields" content='{"lines":{"type":"json","label":"Lines","description":"[{\"t\":\"First line\",\"s\":0.5,\"e\":3.2}, …] seconds from the clip start; add \"words\":[{\"w\",\"s\",\"e\"}] for exact word timing."},"style":{"options":["pop","fade","type","karaoke","kinetic","stack"]},"position":{"options":["bottom","center","top","left"]},"size":{"type":"number","min":24,"max":220,"step":1,"unit":"px"},"weight":{"options":["400","500","600","700","800","900"]}}'>
<title>Lyrics</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--font, system-ui, sans-serif); }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 7% 8%; box-sizing: border-box; }
  .stage.bottom { justify-content: flex-end; align-items: center; text-align: center; padding-bottom: 11%; }
  .stage.center { justify-content: center; align-items: center; text-align: center; }
  .stage.top { justify-content: flex-start; align-items: center; text-align: center; padding-top: 10%; }
  .stage.left { justify-content: center; align-items: flex-start; text-align: start; }
  .line { max-width: 86%; line-height: 1.12; letter-spacing: -0.01em; will-change: transform, opacity; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
  .shadow .line { text-shadow: 0 4px 24px rgba(0, 0, 0, .55), 0 2px 4px rgba(0, 0, 0, .5); }
  .k { position: absolute; left: 50%; top: 50%; white-space: nowrap; will-change: transform, opacity; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
  const P = (k, d) => kadr.prop(k, d);
  const stage = document.getElementById('stage');
  const style = P('style', 'pop');
  const pos = P('position', 'bottom');
  const size = Number(P('size', 76));
  const color = P('color', '#ffffff');
  const accent = P('accent', '#e8ff59');
  const upper = P('upper', false) === true || P('upper', false) === 'true';
  stage.className = `stage ${pos}${P('shadow', true) === false || P('shadow', true) === 'false' ? '' : ' shadow'}`;
  stage.style.fontSize = `${size}px`;
  stage.style.fontWeight = P('weight', '800');
  stage.style.color = color;
  const RTL = /[֐-ࣿיִ-﷿ﹰ-﻿]/;

  // demo lines for a clip without props
  let lines = Array.isArray(kadr.props.lines) ? kadr.props.lines : [
    { t: 'Write your *lyrics* here', s: 0.3, e: 2.6 },
    { t: 'every line on its own time', s: 2.8, e: 5.2 },
    { t: 'and the music *moves* them', s: 5.4, e: 7.7 },
  ];
  // normalise: words with times (given, or spread evenly over the line)
  lines = lines.filter((l) => l && (l.t || l.words)).map((l) => {
    const s = Number(l.s) || 0;
    const e = Math.max(s + 0.2, Number(l.e) || s + 2);
    let words = Array.isArray(l.words) && l.words.length ? l.words.map((w) => ({ w: String(w.w), s: Number(w.s), e: Number(w.e) }))
      : String(l.t).split(/\s+/).filter(Boolean).map((w) => ({ w }));
    if (words.some((w) => !Number.isFinite(w.s))) {
      const span = (e - s) * 0.7; // words arrive over the first 70% of the line
      words = words.map((w, i) => ({ w: w.w, s: s + (span * i) / words.length, e: s + (span * (i + 1)) / words.length }));
    }
    words = words.map((w) => {
      const em = /^\*.+\*$/.test(w.w);
      const txt = em ? w.w.slice(1, -1) : w.w;
      return { ...w, w: upper ? txt.toUpperCase() : txt, em };
    });
    return { s, e, words, rtl: RTL.test(words.map((w) => w.w).join('')) };
  });

  const IN = 0.35; // seconds a line takes to arrive
  const OUT = 0.3; // and to leave
  let shown = null;
  let els = [];

  function build(li) {
    stage.replaceChildren();
    els = [];
    if (li == null) return;
    const l = lines[li];
    if (style === 'kinetic') {
      els = l.words.map((w) => {
        const d = document.createElement('div');
        d.className = 'k';
        d.textContent = w.w;
        d.style.color = w.em ? accent : color;
        stage.append(d);
        return d;
      });
      return;
    }
    const line = document.createElement('div');
    line.className = 'line';
    line.dir = l.rtl ? 'rtl' : 'ltr';
    l.words.forEach((w, i) => {
      const span = document.createElement('span');
      span.className = 'w';
      span.textContent = w.w;
      if (w.em) span.style.color = accent;
      line.append(span);
      if (i < l.words.length - 1) line.append(document.createTextNode(' '));
      els.push(span);
    });
    stage.append(line);
    if (style === 'stack') {
      // the two previous lines stay above, dimmed
      for (let k = Math.max(0, li - 2); k < li; k++) {
        const old = document.createElement('div');
        old.className = 'line';
        old.dir = lines[k].rtl ? 'rtl' : 'ltr';
        old.textContent = lines[k].words.map((w) => w.w).join(' ');
        old.style.opacity = String(0.28 + (k - li + 2) * 0.12);
        old.style.fontSize = '0.72em';
        old.style.marginBottom = '0.25em';
        stage.insertBefore(old, line);
      }
    }
  }

  const E = kadr.ease;
  kadr.onFrame((t) => {
    // the line on screen: the last one that has started and not fully left
    let li = null;
    for (let i = 0; i < lines.length; i++) if (t >= lines[i].s - IN && t < lines[i].e + OUT) li = i;
    if (li !== shown) { shown = li; build(li); }
    if (li == null) return;
    const l = lines[li];
    const lineEl = stage.lastElementChild;
    const out = kadr.clamp((t - l.e) / OUT, 0, 1);

    if (style === 'kinetic') {
      // one word at a time, big, centred; emphasised words bigger
      let cur = -1;
      l.words.forEach((w, i) => { if (t >= w.s - 0.05) cur = i; });
      els.forEach((d, i) => {
        const w = l.words[i];
        const on = i === cur && t < l.e + 0.05;
        const p = E.outBack(kadr.clamp((t - w.s + 0.05) / 0.25, 0, 1));
        const sc = (w.em ? 1.5 : 1.15) * (0.6 + 0.4 * p);
        const rot = (i % 3 - 1) * 3;
        d.style.opacity = on ? String(kadr.clamp(p * 1.4, 0, 1)) : '0';
        d.style.transform = `translate(-50%, -50%) scale(${sc.toFixed(3)}) rotate(${rot}deg)`;
      });
      return;
    }

    if (style === 'fade' || style === 'stack') {
      const p = E.outCubic(kadr.clamp((t - l.s + IN) / IN, 0, 1));
      lineEl.style.opacity = String(p * (1 - out));
      lineEl.style.transform = `translateY(${((1 - p) * 0.4 - out * 0.3).toFixed(3)}em)`;
      lineEl.style.filter = out > 0 ? `blur(${(out * 6).toFixed(1)}px)` : '';
      return;
    }

    lineEl.style.opacity = String(1 - out);
    lineEl.style.transform = `translateY(${(-out * 0.3).toFixed(3)}em)`;
    l.words.forEach((w, i) => {
      const el = els[i];
      const p = kadr.clamp((t - w.s) / 0.22, 0, 1);
      if (style === 'type') {
        el.style.opacity = t >= w.s ? '1' : '0';
        el.style.transform = '';
      } else if (style === 'karaoke') {
        // the whole line is there; sung words light up
        const sung = t >= w.s;
        el.style.opacity = '1';
        el.style.color = sung ? accent : color;
        el.style.transform = `scale(${(1 + 0.08 * (1 - kadr.clamp((t - w.s) / 0.25, 0, 1)) * (sung ? 1 : 0)).toFixed(3)})`;
      } else { // pop
        const q = E.outBack(p);
        el.style.opacity = String(kadr.clamp(p * 2, 0, 1));
        el.style.transform = `translateY(${((1 - q) * 0.35).toFixed(3)}em) scale(${(0.7 + 0.3 * q).toFixed(3)})`;
      }
    });
  });
</script>
</body>
</html>
