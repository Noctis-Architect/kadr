<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:duration" content="5">
<meta name="kadr:description" content="End card / call to action: name, line, and a pulsing button. Set bg to a color for an opaque card, or leave it empty to sit over footage.">
<meta name="kadr:props" content='{"title":"Thanks for watching","subtitle":"New videos every week","button":"Follow","accent":"#e8ff59","bg":"#0d0d10","color":"#f5f5f0"}'>
<title>End card</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; }
  .bg { position: absolute; inset: 0; transform-origin: 50% 100%; }
  .card { position: relative; text-align: center; }
  .t { font-size: 120px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .s { font-size: 40px; font-weight: 500; opacity: .62; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 18px; margin-top: 56px; padding: 26px 52px; border-radius: 999px; font-size: 40px; font-weight: 700; color: #111; position: relative; }
  .btn .ring { position: absolute; inset: 0; border-radius: inherit; border: 3px solid; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #111; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="card" id="card">
  <div class="t" id="t" data-prop="title">Thanks for watching</div>
  <div class="s" id="s" data-prop="subtitle">New videos every week</div>
  <div class="btn" id="btn"><span class="dot"></span><span data-prop="button">Follow</span><span class="ring" id="ring"></span></div>
</div>
<script>
  const P = (k, d) => kadr.prop(k, d);
  const $ = (id) => document.getElementById(id);
  const accent = P('accent', '#e8ff59');
  $('bg').style.background = P('bg', '#0d0d10') || 'transparent';
  $('card').style.color = P('color', '#f5f5f0');
  $('btn').style.background = accent;
  $('ring').style.borderColor = accent;
  const D = kadr.duration;
  kadr.onFrame((t) => {
    const k = kadr.interp;
    $('bg').style.transform = `scaleY(${k(t, [0, 0.5], [0, 1], 'inOutCubic')})`;
    $('t').style.transform = `translateY(${k(t, [0.3, 1], [60, 0], 'outExpo')}px)`;
    $('t').style.opacity = k(t, [0.3, 0.7], [0, 1]);
    $('s').style.transform = `translateY(${k(t, [0.45, 1.15], [40, 0], 'outExpo')}px)`;
    $('s').style.opacity = k(t, [0.45, 0.85], [0, 0.62]);
    const b = k(t, [0.7, 1.3], [0, 1], 'outBack');
    $('btn').style.transform = `scale(${0.6 + 0.4 * b})`;
    $('btn').style.opacity = Math.min(1, b * 1.4);
    const cyc = ((t - 1.3) % 1.4 + 1.4) % 1.4;
    const pulse = t > 1.3 ? cyc / 1.4 : 0;
    $('ring').style.transform = `scale(${1 + pulse * 0.35}, ${1 + pulse * 0.9})`;
    $('ring').style.opacity = t > 1.3 ? (1 - pulse) * 0.8 : 0;
    const out = k(t, [D - 0.4, D], [0, 1], 'inCubic');
    $('card').style.opacity = 1 - out;
  });
</script>
</body>
</html>
