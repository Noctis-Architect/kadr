<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:duration" content="4">
<meta name="kadr:category" content="Brand">
<meta name="kadr:description" content="Logo reveal: rings ripple out, the logo springs in under a light sweep, then the name and tagline settle. Set logo to an image in media/ (leave it empty for a monogram).">
<meta name="kadr:props" content='{"logo":"","name":"KADR STUDIO","tagline":"Made frame by frame","accent":"#e8ff59","bg":"#0b0b0e"}'>
<title>Logo reveal</title>
<style>
  :root { --accent: #e8ff59; --bg: #0b0b0e; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: system-ui, "Vazirmatn", sans-serif; color: #f5f5f0; display: grid; place-items: center; }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent) 10%, var(--bg)), var(--bg) 60%); }
  .stack { position: relative; display: grid; justify-items: center; animation: out .5s cubic-bezier(.7, 0, .84, 0) 3.5s both; }
  .ring { position: absolute; top: 120px; left: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
  .r1 { animation: ripple 1.6s cubic-bezier(.16, 1, .3, 1) .05s both; }
  .r2 { animation: ripple 1.6s cubic-bezier(.16, 1, .3, 1) .25s both; }
  .logo { position: relative; width: 240px; height: 240px; border-radius: 56px; overflow: hidden; display: grid; place-items: center; background: var(--accent); animation: spring 1s cubic-bezier(.34, 1.56, .64, 1) .2s both; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .mono { font-size: 130px; font-weight: 900; color: #111; letter-spacing: -.04em; }
  .sweep { position: absolute; inset: -40%; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .55) 50%, transparent 60%); animation: sweep 1s ease-in-out .9s both; }
  .name { margin-top: 56px; font-size: 76px; font-weight: 800; letter-spacing: .3em; animation: track 1.2s cubic-bezier(.16, 1, .3, 1) .9s both; }
  .tag { margin-top: 14px; font-size: 32px; font-weight: 500; opacity: .6; animation: fade .8s ease-out 1.5s both; }
  @keyframes ripple { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.6); } }
  @keyframes spring { from { opacity: 0; transform: scale(.3) rotate(-20deg); } }
  @keyframes sweep { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
  @keyframes track { from { opacity: 0; letter-spacing: .9em; filter: blur(8px); } }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } }
  @keyframes out { to { opacity: 0; transform: scale(.96); } }
</style>
</head>
<body>
  <div class="bg" data-part="Background"></div>
  <div class="stack">
    <div class="ring r1" data-part="Ring 1"></div>
    <div class="ring r2" data-part="Ring 2"></div>
    <div class="logo" id="logo" data-part="Logo"><img id="img" data-prop-src="logo" alt=""><span class="mono" id="mono">K</span><div class="sweep" data-part="Light sweep"></div></div>
    <div class="name" data-part="Name" data-prop="name" dir="auto">KADR STUDIO</div>
    <div class="tag" data-part="Tagline" data-prop="tagline" dir="auto">Made frame by frame</div>
  </div>
<script>
  // an image when one is set, otherwise the first letter of the name
  const logo = kadr.prop('logo', '');
  document.getElementById(logo ? 'mono' : 'img').remove();
  if (!logo) document.getElementById('mono').textContent = (kadr.prop('name', 'K').trim()[0] || 'K').toUpperCase();
  else document.getElementById('logo').style.background = 'transparent';
</script>
</body>
</html>
