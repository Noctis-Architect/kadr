<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:duration" content="3">
<meta name="kadr:category" content="Transitions">
<meta name="kadr:description" content="Countdown: a ring sweeps around each number, one per second. Set the clip length to `from` seconds.">
<meta name="kadr:props" content='{"from":3,"label":"Starting in","accent":"#e8ff59","bg":"#0b0b0e"}'>
<title>Countdown</title>
<style>
  :root { --accent: #e8ff59; --bg: #0b0b0e; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: system-ui, "Vazirmatn", sans-serif; color: #f5f5f0; display: grid; place-items: center; }
  .bg { position: absolute; inset: 0; background: var(--bg); }
  .label { position: absolute; top: 22%; width: 100%; text-align: center; font-size: 42px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; opacity: .6; animation: fade .6s ease-out 0s both; }
  .dial { position: relative; width: 420px; height: 420px; }
  .dial svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 230px; font-weight: 900; font-variant-numeric: tabular-nums; }
  @keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
  <div class="bg" data-part="Background"></div>
  <div class="label" data-part="Label" data-prop="label" dir="auto">Starting in</div>
  <div class="dial" data-part="Dial">
    <svg viewBox="0 0 420 420"><circle cx="210" cy="210" r="190" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="14"/><circle id="arc" cx="210" cy="210" r="190" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"/></svg>
    <div class="num" id="num">3</div>
  </div>
<script>
  const from = Math.max(1, Math.round(kadr.prop('from', 3)));
  const arc = document.getElementById('arc');
  const num = document.getElementById('num');
  const L = 2 * Math.PI * 190;
  arc.style.strokeDasharray = L;
  kadr.onFrame((t) => {
    const n = Math.max(1, from - Math.floor(t));
    const u = t - Math.floor(t); // 0..1 inside this second
    num.textContent = n;
    arc.style.strokeDashoffset = L * kadr.interp(u, [0, 0.9], [1, 0], 'inOutCubic');
    const s = kadr.interp(u, [0, 0.25], [1.35, 1], 'outBack') * kadr.interp(u, [0.82, 1], [1, 0.7], 'inCubic');
    num.style.transform = `scale(${s})`;
    num.style.opacity = kadr.interp(u, [0, 0.12], [0, 1]) * kadr.interp(u, [0.85, 1], [1, 0]);
  });
</script>
</body>
</html>
