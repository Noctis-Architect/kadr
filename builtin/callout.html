<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="kadr:duration" content="4">
<meta name="kadr:category" content="Text">
<meta name="kadr:description" content="Callout: a circle is drawn around a spot, an arrow points at it and a label pops up. x and y are percentages of the frame.">
<meta name="kadr:props" content='{"text":"Look here","x":40,"y":55,"size":150,"accent":"#e8ff59"}'>
<title>Callout</title>
<style>
  :root { --accent: #e8ff59; --x: 40; --y: 55; --size: 150; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: system-ui, "Vazirmatn", sans-serif; }
  .spot { position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); width: calc(var(--size) * 2px); height: calc(var(--size) * 2px); transform: translate(-50%, -50%); animation: leave .5s cubic-bezier(.7, 0, .84, 0) 3.5s both; }
  .spot svg { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); overflow: visible; }
  .circle { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 1000; animation: draw 1s cubic-bezier(.65, 0, .35, 1) .1s both; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .45)); }
  .arrow { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 600; animation: draw .7s cubic-bezier(.65, 0, .35, 1) .8s both; }
  .label { position: absolute; left: calc(100% + 150px); top: -150px; white-space: nowrap; padding: 14px 26px; border-radius: 14px; background: var(--accent); color: #111; font-size: 44px; font-weight: 800; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); animation: pop .6s cubic-bezier(.34, 1.56, .64, 1) 1.3s both; }
  @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.5) translateY(20px); } }
  @keyframes leave { to { opacity: 0; } }
</style>
</head>
<body>
  <div class="spot">
    <svg viewBox="0 0 340 340" preserveAspectRatio="none">
      <path class="circle" data-part="Circle" pathLength="1000" d="M170 22C262 18 322 82 318 172S250 322 166 318 20 254 24 168 90 26 182 24"/>
      <path class="arrow" data-part="Arrow" pathLength="600" d="M440 -100C400 -40 360 10 300 40M300 40l40 -6M300 40l10 38"/>
    </svg>
    <div class="label" data-part="Label" data-prop="text" dir="auto">Look here</div>
  </div>
</body>
</html>
