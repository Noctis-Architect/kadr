[package]
name = "kadr-desktop"
version = "0.2.0"
description = "kadr desktop app"
authors = ["kadr contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kadr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
